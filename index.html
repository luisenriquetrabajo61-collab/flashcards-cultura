.app{max-width:520px;min-height:100%;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}

/* ---------- Cabecera y contador ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.icon-btn{font:inherit;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.15rem;cursor:pointer}
.counter{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.counter span:last-child{color:var(--soft);font-weight:500}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--c,#4338CA);transition:width .35s ease}

/* ---------- Tarjeta con giro 3D ---------- */
.scene{perspective:1200px;--h:clamp(280px,52dvh,400px)}
.card{position:relative;height:var(--h);transform-style:preserve-3d;cursor:pointer;

.card.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:22px;
  border-radius:28px;box-shadow:var(--shadow);overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden}
.front{background:var(--surface);border:2px solid var(--line)}
.back{background:var(--c);color:#fff;transform:rotateY(180deg);border:2px solid var(--c)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.back .chip{background:rgba(255,255,255,.2);color:#fff}
.badge{font-size:.85rem;font-weight:700;opacity:0}
.scene[data-status="sabida"] .badge,.scene[data-status="repasar"] .badge{opacity:1}
.front .badge{color:var(--warn)}
.scene[data-status="sabida"] .front .badge{color:var(--ok)}
.scene[data-status="sabida"] .front{border-color:var(--ok)}
.scene[data-status="repasar"] .front{border-color:var(--warn)}
.back .badge{color:#fff}
.text{font-weight:800;line-height:1.2;letter-spacing:-.01em;font-size:clamp(1.45rem,6.2vw,2rem);overflow-wrap:anywhere;overflow:auto;padding:8px 0}
.hint{font-size:.85rem;color:var(--soft)}

.btn{font:inherit;font-weight:700;min-height:50px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s ease,border-color .15s}

.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--soft);font-size:.9rem}
.link{font:inherit;background:none;border:none;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;padding:8px 0}

@media (prefers-reduced-motion:reduce){.card,.track i,.btn{transition:none}}

const COLORES = {
  "Historia":"#C2410C", "Geografía":"#0F766E", "Ciencia":"#1D4ED8", "Arte y música":"#A21CAF",
  "Cuerpo y salud":"#BE123C", "Deportes":"#15803D", "Tecnología":"#4338CA", "Lengua":"#B45309",
  "Capitales":"#0E7490", "Elementos químicos":"#6D28D9"
};
const COLOR_DEFECTO = "#4338CA";
const CLAVE = "cultura-general-progreso-v1";

/* ---------- Estado ---------- */
let orden = TARJETAS.map((_, i) => i);
let pos = 0, volteada = false, aleatorio = false, ocupado = false;
let progreso = {};
try { progreso = JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch (e) {}
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(progreso)); } catch (e) {} };
const $ = id => document.getElementById(id);
const sinMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Pintar la tarjeta actual ---------- */
function pintar() {
  const t = TARJETAS[orden[pos]], n = orden.length;
  const color = COLORES[t.categoria] || COLOR_DEFECTO;
  const estado = progreso[t.id] || "";
  const escena = $("scene");

  document.documentElement.style.setProperty("--c", color);
  escena.style.setProperty("--c", color);
  escena.dataset.status = estado;
  $("q").textContent = t.pregunta;
  $("a").textContent = t.respuesta;
  document.querySelectorAll("[data-cat]").forEach(e => e.textContent = t.categoria);
  document.querySelectorAll("[data-badge]").forEach(e =>
    e.textContent = estado === "sabida" ? "✓ Ya me la sé" : estado === "repasar" ? "↻ Repasar luego" : "");

  $("count").textContent = "Tarjeta " + (pos + 1) + " de " + n;
  $("bar").style.width = ((pos + 1) / n * 100) + "%";
  const vals = Object.values(progreso);
  $("stats").textContent = vals.filter(v => v === "sabida").length + " sabidas · " + vals.filter(v => v === "repasar").length + " por repasar";
  actualizarGiro();
}

function actualizarGiro() {
  $("card").classList.toggle("is-flipped", volteada);
  $("front").setAttribute("aria-hidden", volteada);
  $("back").setAttribute("aria-hidden", !volteada);
  $("flip").textContent = volteada ? "Ver pregunta" : "Ver respuesta";
  $("card").setAttribute("aria-label", volteada ? "Respuesta. Pulsa para ver la pregunta." : "Pregunta. Pulsa para ver la respuesta.");
}

/* ---------- Acciones ---------- */
function voltear() { volteada = !volteada; actualizarGiro(); }

function ir(delta) {
  if (ocupado) return;
  const aplicar = () => { pos = (pos + delta + orden.length) % orden.length; ocupado = false; pintar(); };
  if (volteada) {              // primero se gira de vuelta para no "revelar" la siguiente respuesta
    ocupado = true; volteada = false; actualizarGiro();
    setTimeout(aplicar, sinMovimiento ? 0 : 320);
  } else aplicar();
}

function marcar(estado) {
  if (ocupado) return;
  progreso[TARJETAS[orden[pos]].id] = estado; guardar(); pintar();
  setTimeout(() => ir(1), sinMovimiento ? 0 : 450);   // feedback visual y pasa a la siguiente
}

function alternarOrden() {
  aleatorio = !aleatorio;
  orden = TARJETAS.map((_, i) => i);
  if (aleatorio) for (let i = orden.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [orden[i], orden[j]] = [orden[j], orden[i]];
  }
  pos = 0; volteada = false;
  $("shuffle").textContent = "Orden: " + (aleatorio ? "aleatorio" : "secuencial");
  pintar();
}

/* ---------- Eventos ---------- */
$("card").addEventListener("click", voltear);
$("flip").addEventListener("click", voltear);
$("next").addEventListener("click", () => ir(1));
$("prev").addEventListener("click", () => ir(-1));
$("known").addEventListener("click", () => marcar("sabida"));
$("later").addEventListener("click", () => marcar("repasar"));
$("shuffle").addEventListener("click", alternarOrden);
$("reset").addEventListener("click", () => { progreso = {}; guardar(); pintar(); });
$("theme").addEventListener("click", () => {
  const r = document.documentElement;
  const oscuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = oscuro ? "light" : "dark";
  try { localStorage.setItem("cultura-general-tema", r.dataset.theme); } catch (e) {}
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") ir(1);
  else if (e.key === "ArrowLeft") ir(-1);
  else if ((e.key === " " || e.key === "Enter") && e.target === $("card")) { e.preventDefault(); voltear(); }
});
  
/* ---------- Ventana de Política de Privacidad ---------- */
const modal = $("modal");
function abrirPrivacidad(e) {
  if (e) e.preventDefault();
  if (!modal.open) modal.showModal();
  modal.querySelector(".sheet-body").scrollTop = 0;
}
const cerrarPrivacidad = () => modal.close();
$("privacy").addEventListener("click", abrirPrivacidad);
$("close").addEventListener("click", cerrarPrivacidad);
$("x").addEventListener("click", cerrarPrivacidad);
modal.addEventListener("click", e => { if (e.target === modal) cerrarPrivacidad(); });
modal.addEventListener("close", () => {
  if (location.hash === "#privacidad") history.replaceState(null, "", location.pathname + location.search);
});
if (location.hash === "#privacidad") abrirPrivacidad();
/* ---------- Inicio ---------- */
try { const tema = localStorage.getItem("cultura-general-tema"); if (tema) document.documentElement.dataset.theme = tema; } catch (e) {}
pintar();
</script>
